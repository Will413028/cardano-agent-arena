name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  walking-skeleton:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pinned devnet image
        run: docker pull bloxbean/yaci-cli:0.12.0
      - run: make check
        timeout-minutes: 10
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-evidence
          path: |
            .local/devnet/*/acceptance.json
            .local/devnet/*/*.index.json
          if-no-files-found: error
